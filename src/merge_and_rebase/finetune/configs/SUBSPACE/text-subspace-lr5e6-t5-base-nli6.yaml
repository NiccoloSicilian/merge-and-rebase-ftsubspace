# The subspace at the plain fine-tuning rate, 5e-6.
#
# A third arm, so the three differ in one thing at a time:
#   text-full-t5-base-nli6.yaml       full,     5e-6
#   this file                         subspace, 5e-6   <- matched rate
#   text-subspace-t5-base-nli6.yaml   subspace, 5e-5   <- matched delta scale
#
# Neither pairing is the whole comparison. Matching the rate isolates the
# hypothesis space but handicaps the subspace, since AdamW moves each
# coordinate by about the learning rate whatever the gradient scale and there
# are 224 times fewer cores than weights. Matching the delta scale is the fair
# optimisation setting but changes two fields at once. Running all three is
# what makes the claim checkable.

common:
  seed: 42
  deterministic: false

  device: cuda
  dtype: fp32

  backbone:
    name: hf_text
    model_name_or_path: google-t5/t5-base
    model_arch: t5
    model_kind: sequence_classification
    num_labels: 3
    trust_remote_code: false
    use_fast_tokenizer: true

  data:
    batch_size: 4
    num_workers: 4
    max_length: 512

  train:
    epochs: 3
    optimizer:
      name: adamw
    lr: 5.0e-6
    weight_decay: 0.01
    accumulate_grad_batches: 32
    lr_scheduler:
      name: cosine
      warmup_steps: 200
    grad_clip_norm: 1.0
    early_stopping: false
    early_stopping_patience: 5

  strategy:
    name: subspace
    params:
      subspace:
        k: 64
        delta: 0.01
        batches: 30
        reference_batches: 0          # 0 = come batches
        # Un corpus generico, NON uno dei sei task NLI.
        reference_dataset: wikitext
        reference_config: wikitext-103-raw-v1
        reference_split: train
        reference_size: 4096
        max_length: 128
        one_sided: false
        no_reference: false

  output:
    out_dir: src/checkpoints/subspace_text_lr5e6
    save_format: full             # full | head | peft
    save_last_epoch: false
    extract_heads: true

  logging:
    use_wandb: false
    project: null
    entity: null
    tags: []
    mode: online
    local_log_dir: null
    log_every_n_steps: 50
    run_name: null

datasets_order:
  - snli
  - mnli
  - sick
  - qnli
  - rte
  - scitail

datasets:
  snli:
    train:
      epochs: 3
  mnli:
    train:
      epochs: 3
  sick:
    train:
      epochs: 20
  qnli:
    train:
      epochs: 3
  rte:
    train:
      epochs: 50
  scitail:
    train:
      epochs: 50
