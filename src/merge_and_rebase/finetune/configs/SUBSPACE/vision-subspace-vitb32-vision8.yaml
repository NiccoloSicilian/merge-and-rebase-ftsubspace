# Merge-aware training by confining each expert update to a selected subspace.
#
# Every eligible matrix is reparametrised as W = W_0 + U C V^T, with U and V
# frozen bases fixed before training and C the only trainable tensor. Unlike
# DELTA (distil linearised behaviour) or TAK (penalise curvature-weighted
# drift), the constraint is structural: the delta is rank <= k with its row and
# column spaces pinned by construction.
#
#   python -m merge_and_rebase.finetune.train_vision \
#     --vision-config src/merge_and_rebase/finetune/configs/SUBSPACE/vision-subspace-vitb32-vision8.yaml
common:
  seed: 42
  deterministic: false
  device: cuda
  dtype: fp32

  backbone:
    name: openclip
    clip_model: ViT-B-32
    clip_pretrained: openai     # quick_gelu is applied automatically for this tag

  data:
    batch_size: 128
    num_workers: 6
    val_fraction: 0.1
    pin_memory: true
    train_preprocess: train

  train:
    epochs: null
    optimizer:
      name: adamw
    # A larger rate than full fine-tuning on purpose. AdamW moves each
    # coordinate by about the learning rate regardless of gradient scale, so
    # ||Delta|| grows like lr * sqrt(#parameters); matching the delta scale of a
    # full fine-tune over 85M weights from ~200k cores would need roughly
    # twenty times the rate, so 1e-4 against 1e-5 is the conservative side.
    lr: 1.0e-4
    # Zero on purpose: decaying the cores pulls the delta towards zero, which is
    # a different regulariser from decaying weights towards zero.
    weight_decay: 0.0
    accumulate_grad_batches: 1
    lr_scheduler:
      name: cosine
    grad_clip_norm: 1.0
    early_stopping: false
    early_stopping_patience: 5

  strategy:
    name: subspace
    forward_mode: standard
    params:
      # Same subset DELTA and TAK regularise, so the three differ in one thing.
      trainable_params: regularized_only
      subspace:
        k: 64
        delta: 0.01
        batches: 30
        reference_batches: 0          # 0 = same as batches
        # Must NOT be one of the tasks being merged.
        reference_datasets:
          - ImageNet1KWds
        one_sided: false
        no_reference: false
        include_non_matrices: false

  output:
    out_dir: src/checkpoints/subspace_vitb32_8vision
    save_format: full
    save_last_epoch: true

  logging:
    use_wandb: false
    project: null
    entity: null
    tags:
      - subspace
      - vision8
      - vitb32
      - imagenet1k-ref
    mode: online
    local_log_dir: .log
    log_every_n_steps: 50
    run_name: null

datasets_order:
  - Cars
  - DTD
  - EuroSAT
  - GTSRB
  - MNIST
  - RESISC45
  - SUN397
  - SVHN

datasets:
  Cars:
    train:
      epochs: 35
  DTD:
    train:
      epochs: 76
  EuroSAT:
    train:
      epochs: 12
  GTSRB:
    train:
      epochs: 11
  MNIST:
    train:
      epochs: 5
  RESISC45:
    train:
      epochs: 15
  SUN397:
    train:
      epochs: 14
  SVHN:
    train:
      epochs: 4
