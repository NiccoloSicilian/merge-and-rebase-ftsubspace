# Subspace-constrained fine-tuning on the six NLI tasks.
#
# Backbone: google-t5/t5-base, the ORIGINAL T5, as in the repository's own
# text-t5-base-scitail-full.yaml. Not google/t5-v1_1-base, which text.yaml
# names: v1.1 was pre-trained on C4 alone with no supervised mixture, so it has
# never seen a downstream task, and neither full fine-tuning nor this method
# gets off chance on a 2.5k-example task like RTE from there. The original T5
# was pre-trained on a multi-task mixture that includes GLUE.
#
# Same protocol as text.yaml with two deliberate changes: the strategy, and a
# ten-times larger learning rate. AdamW moves each coordinate by about the
# learning rate regardless of gradient scale, so ||Delta|| grows like
# lr*sqrt(#parameters) and the cores are about two orders of magnitude fewer
# than the matrices they parameterise.
#
#   python -m merge_and_rebase.finetune.train_text \
#     --text-config src/merge_and_rebase/finetune/configs/SUBSPACE/text-subspace-t5-base-nli6.yaml \
#     --tasks rte#
# Hyperparameters from the DELTA paper, appendix, language domain:
#   "batch size of 128, AdamW, learning rate of 3e-4, an iteration-based
#    cosine-annealing scheduler and a weight decay of 0.01. Like in vision
#    tasks, we did not apply gradient clipping."
#
# text.yaml in this repository is a template, not that configuration: it names
# google/t5-v1_1-base and sets lr 5e-6, sixty times smaller. With it neither
# full fine-tuning nor this method gets off chance on RTE.
#
# warmup_steps is 0 because the paper describes a plain cosine annealing with
# no warmup. The template's 200 steps are 10.3 epochs on RTE, which has only 19
# updates per epoch at an effective batch of 128.
# This arm raises the rate instead. AdamW moves each coordinate by about the
# learning rate whatever the gradient scale, so matching the delta scale of a
# 198M-weight update from 885k cores would need roughly fifteen times the
# paper's rate; 2e-3 is about seven, the conservative side of that.

common:
  seed: 42
  deterministic: false

  device: cuda
  dtype: fp32

  backbone:
    name: hf_text
    model_name_or_path: google-t5/t5-base
    model_arch: t5
    model_kind: sequence_classification
    num_labels: 3
    trust_remote_code: false
    use_fast_tokenizer: true

  data:
    batch_size: 4
    num_workers: 4
    max_length: 512

  train:
    epochs: 3
    optimizer:
      name: adamw
    lr: 2.0e-3
    weight_decay: 0.01
    accumulate_grad_batches: 32
    lr_scheduler:
      name: cosine
      warmup_steps: 0
    grad_clip_norm: 0.0
    early_stopping: false
    early_stopping_patience: 5

  strategy:
    name: subspace
    params:
      subspace:
        k: 64
        # Tenuta piccola: una ridge grande porta la base verso l'ablazione
        # no_reference, che e un braccio a parte. La dispersione da
        # campionamento si combatte con i campioni, non con la ridge.
        delta: 0.01
        # 30 termini di Gram da 128 campioni ciascuno, esattamente come vision.
        # I 128 non sono un batch fisico: il gradiente viene accumulato su
        # 128/4 = 32 batch del loader prima di formare la Gram, quindi la
        # memoria e quella di un batch da 4 e il risultato identico a uno da 128.
        batches: 30
        gram_batch_size: 128
        # La testa e inizializzata a caso: il gradiente del task la attraversa,
        # quindi senza riscaldarla A_task misura una lettura lineare casuale.
        head_warmup_steps: 300
        head_warmup_lr: 1.0e-3
        # 47 x 128 = 6016 campioni, non 3840: le feed-forward di T5 hanno Gram
        # 3072x3072, dove 3840 campioni sono p/n = 0.8 e lo spettro e quasi
        # tutto rumore. Solo il denominatore puo crescere -- il numeratore
        # pesca dal train del task, e rte ne ha 2490 in tutto.
        reference_batches: 47
        # Un corpus generico, NON uno dei sei task NLI.
        reference_dataset: wikitext
        reference_config: wikitext-103-raw-v1
        reference_split: train
        # Servono 3840 righe (30 x 128) e il filtro ne scarta circa meta,
        # quindi con 32768 estratte nessun batch di riferimento riusa una riga.
        reference_size: 32768
        max_length: 128
        one_sided: false
        no_reference: false

  output:
    out_dir: src/checkpoints/subspace_text_lr2e3_warm
    save_format: full             # full | head | peft
    save_last_epoch: false
    extract_heads: true

  logging:
    use_wandb: false
    project: null
    entity: null
    tags: []
    mode: online
    local_log_dir: null
    log_every_n_steps: 50
    run_name: null

datasets_order:
  - snli
  - mnli
  - sick
  - qnli
  - rte
  - scitail

datasets:
  snli:
    train:
      epochs: 3
  mnli:
    train:
      epochs: 3
  sick:
    train:
      epochs: 20
  qnli:
    train:
      epochs: 3
  rte:
    train:
      epochs: 50
  scitail:
    train:
      epochs: 50
